[package]
name = "pithpack"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
description = "Compress codebases into token-lean context bundles for LLMs"
license = "MIT"
repository = "https://github.com/eckorog2005/pithpack"
homepage = "https://github.com/eckorog2005/pithpack"
readme = "README.md"
keywords = ["llm", "context", "tokens", "tree-sitter", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.19"
ignore = "0.4.30"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiktoken-rs = "0.12.1"
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"
tempfile = "3.27.0"
